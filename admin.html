<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin panel — Dokan</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/link" href="https://i.postimg.cc/zBSqx8kS/Screenshot-2026-07-11-104056.png" />
</head>
<body>

<header id="siteHeader"></header>

<main>
  <!-- ACCESS GATE -->
  <div class="auth-wrap" id="adminGate" style="display:none;">
    <div class="auth-card">
      <h1>Admin sign in</h1>
      <p class="auth-subtitle">Only store admin accounts can open this panel.</p>

      <div class="form-error" id="gateError"></div>

      <form id="gateForm">
        <div class="field">
          <label for="gateEmail">Admin email</label>
          <input type="email" id="gateEmail" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="gatePassword">Password</label>
          <input type="password" id="gatePassword" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in to admin</button>
      </form>
    </div>
  </div>

  <!-- ADMIN CONTENT -->
  <div class="container admin-layout" id="adminContent" style="display:none;">
    <div class="page-title-row">
      <h1>Admin panel</h1>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-outline btn-sm" id="lockAdminBtn">Lock panel</button>
        <a class="btn btn-outline btn-sm" href="index.html">← Back to shop</a>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="chip admin-tab chip-active" data-tab="products">Products</button>
      <button class="chip admin-tab" data-tab="users">Users</button>
      <button class="chip admin-tab" data-tab="orders">Orders</button>
      <button class="chip admin-tab" data-tab="sellers">Seller requests</button>
    </div>

    <!-- PRODUCTS -->
    <section class="admin-panel" data-panel="products" style="display:block;">
      <div class="admin-grid">
        <div>
          <div id="adminProductList"></div>
          <div class="pagination" id="productsPagination"></div>
        </div>

        <form class="admin-form" id="addProductForm">
          <h3>Add a product</h3>
          <div class="field">
            <label for="newName">Name</label>
            <input type="text" id="newName" required />
          </div>
          <div class="field">
            <label for="newCategorySelect">Category</label>
            <select id="newCategorySelect"></select>
          </div>
          <div class="field" id="newCategoryCustomWrap" style="display:none;">
            <label for="newCategoryCustom">New category name</label>
            <input type="text" id="newCategoryCustom" placeholder="e.g. Sportswear" />
          </div>
          <div class="field">
            <label for="newPrice">Price (BDT ৳)</label>
            <input type="number" id="newPrice" min="0" step="0.01" required />
          </div>
          <div class="field">
            <label for="newStock">Stock</label>
            <input type="number" id="newStock" min="0" step="1" required />
          </div>
          <div class="field">
            <label for="newBrand">Brand (optional)</label>
            <input type="text" id="newBrand" placeholder="e.g. Tecno" />
          </div>
          <div class="field">
            <label>Colours (optional)</label>
            <div id="newColourPicker"></div>
          </div>
          <div class="field">
            <label for="newComparePrice">Original price (optional, shown struck through)</label>
            <input type="number" id="newComparePrice" min="0" step="0.01" />
          </div>
          <div class="field">
            <label for="newImage">Main image URL (optional)</label>
            <input type="url" id="newImage" placeholder="https://…" />
          </div>
          <div class="field">
            <label for="newExtraImages">More image URLs (optional, one per line)</label>
            <textarea id="newExtraImages" rows="3" placeholder="https://…&#10;https://…"></textarea>
          </div>
          <div class="field">
            <label for="newDescription">Description</label>
            <div id="newDescription" class="rich-editor" data-rich contenteditable="true" data-placeholder="Type or paste product details here. Headings, bullets and bold text are kept."></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Add product</button>
          <p class="form-success" id="addProductMsg">Product added ✓</p>
        </form>
      </div>
    </section>

    <!-- SELLER REQUESTS -->
    <section class="admin-panel" data-panel="sellers">
      <div id="sellerRequestList"></div>
    </section>

    <!-- USERS (linked to their orders) -->
    <section class="admin-panel" data-panel="users">
      <div id="adminUserList"></div>
      <div class="pagination" id="usersPagination"></div>
    </section>

    <!-- ORDERS -->
    <section class="admin-panel" data-panel="orders">
      <div id="adminOrderList"></div>
      <div class="pagination" id="ordersPagination"></div>
    </section>
  </div>
</main>

<footer id="siteFooter"></footer>

<script src="js/error-handler.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/db.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-sellers.js"></script>
</body>
</html>
