<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — Dokan</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/link" href="https://i.postimg.cc/zBSqx8kS/Screenshot-2026-07-11-104056.png" />
</head>
<body>

<header id="siteHeader"></header>

<main>
  <div class="container">
    <div class="page-title-row">
      <h1>Checkout</h1>
      <a class="btn btn-outline btn-sm" href="cart.html">← Back to cart</a>
    </div>

    <div class="checkout-layout">
      <form id="checkoutForm">
        <div class="field">
          <label for="checkoutName">Full name</label>
          <input type="text" id="checkoutName" required />
        </div>
        <div class="field">
          <label for="checkoutPhone">Phone number</label>
          <input type="tel" id="checkoutPhone" required placeholder="+880 1XXX-XXXXXX" />
        </div>
        <div class="field">
          <label for="checkoutAddress">Delivery address</label>
          <textarea id="checkoutAddress" required placeholder="House, road, area, city"></textarea>
        </div>
        <div class="field">
          <label for="checkoutPayment">Payment method</label>
          <select id="checkoutPayment">
            <option>Cash on Delivery</option>
            <option>Card on Delivery</option>
            <option>Mobile Banking (bKash / Nagad)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Place order</button>
      </form>

      <aside class="summary-card">
        <h3>Order summary</h3>
        <div id="summaryList"></div>
        <div class="summary-row summary-row-total"><span>Total</span><span id="summaryTotal">৳0.00</span></div>
      </aside>
    </div>
  </div>
</main>

<footer id="siteFooter"></footer>

<script src="js/error-handler.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/db.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
