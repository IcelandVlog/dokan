<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — Dokan</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/link" href="https://i.postimg.cc/zBSqx8kS/Screenshot-2026-07-11-104056.png" />
</head>
<body>

<header id="siteHeader"></header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create an account</h1>
      <p class="auth-subtitle">Takes a minute — you'll need this to place orders.</p>

      <div class="form-error" id="formError"></div>

      <form id="signupForm">
        <div class="field">
          <label for="signupName">Full name</label>
          <input type="text" id="signupName" required placeholder="Jamil Rahman" />
        </div>
        <div class="field">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" required minlength="6" placeholder="At least 6 characters" />
        </div>
        <div class="field">
          <label for="signupConfirm">Confirm password</label>
          <input type="password" id="signupConfirm" required minlength="6" placeholder="Re-enter password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>
      </form>

      <div class="oauth-divider"><span>OR</span></div>
      <button type="button" class="btn btn-outline btn-block btn-lg google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C.9 16.6 0 20.2 0 24s.9 7.4 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.7-4.2-13.6-9.9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Continue with Google
      </button>

      <p class="form-note">Already have an account? <a href="login.html" style="color:var(--color-primary); font-weight:600;">Sign in</a></p>
    </div>
  </div>
</main>

<footer id="siteFooter"></footer>

<script src="js/error-handler.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/db.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
