<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Dokan</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/link" href="https://i.postimg.cc/zBSqx8kS/Screenshot-2026-07-11-104056.png" />
</head>
<body>

<header id="siteHeader"></header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Sign in to place an order or view your history.</p>

      <div class="form-error" id="formError"></div>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
      </form>

      <p class="form-note">New here? <a href="signup.html" style="color:var(--color-primary); font-weight:600;">Create an account</a></p>
      <p class="form-note">Admin demo login: admin@dokan.com / admin123</p>
    </div>
  </div>
</main>

<footer id="siteFooter"></footer>

<script src="js/error-handler.js"></script>
<script src="js/db.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/login.js"></script>
</body>
</html>
