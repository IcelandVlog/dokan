<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your cart — Dokan</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/link" href="https://i.postimg.cc/zBSqx8kS/Screenshot-2026-07-11-104056.png" />
</head>
<body>

<header id="siteHeader"></header>

<main>
  <div class="container">
    <div class="page-title-row">
      <h1>Your cart</h1>
      <a class="btn btn-outline btn-sm" href="index.html">← Continue shopping</a>
    </div>

    <div class="cart-layout">
      <div>
        <div id="cartList"></div>
        <div class="empty-state" id="cartEmpty" style="display:none;">
          <p>Your cart is empty.</p>
          <a class="btn btn-primary" href="index.html">Browse products</a>
        </div>
      </div>

      <aside class="cart-summary" id="cartSummary">
        <h3>Order summary</h3>
        <div class="summary-row"><span>Items</span><span id="itemCount">0</span></div>
        <div class="summary-row summary-row-total"><span>Total</span><span id="cartTotal">$0.00</span></div>
        <button class="btn btn-primary btn-block btn-lg" id="checkoutBtn" style="margin-top:16px;">Proceed to checkout</button>
        <p class="muted" style="margin-top:10px; text-align:center;">Sign in is required to place an order.</p>
      </aside>
    </div>
  </div>
</main>

<footer id="siteFooter"></footer>

<script src="js/error-handler.js"></script>
<script src="js/db.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/cart-page.js"></script>
</body>
</html>
